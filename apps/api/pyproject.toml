[project]
name = "soarup-api"
version = "0.1.0"
description = "SoarUp Backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    "boto3>=1.34.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "structlog>=24.0.0",
    "sentry-sdk[fastapi]>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "bandit>=1.7.0",
    "detect-secrets>=1.5.0",
    "pip-audit>=2.10.0",
    "httpx>=0.27.0",
    "fakeredis>=2.20.0",
]

[tool.ruff]
target-version = "py312"
line-length = 250
exclude = ["venv", ".venv", "alembic", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "A", "COM", "C4", "DTZ", "T20", "RET", "SIM", "ARG", "PTH"]
ignore = ["S101", "COM812", "ARG001", "ARG002", "B008",] # Allow assert in tests and trailing comma and ignoring FastAPI dependencies

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]  # ← Combined into one array
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["app.models.*", "tests.*"]  # ← Combined into one array
disallow_untyped_defs = false
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = [
    "pydantic_settings.*",
    "alembic.*",
    "bandit.*",
    "detect_secrets.*",
    "celery.*",
    "redis.*",
    "boto3.*",
    "botocore.*",
    "aioboto3.*",
    "structlog.*",
    "supabase.*",
    "supabase_auth.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--cov=app",
    "--cov-report=xml",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
    "-v",
]
markers = [
    "db: marks tests that require a live database connection",
    "slow: marks slow tests",
]

[tool.coverage.run]
omit = [
    "tests/*",
    "alembic/*",
    "app/main.py",
    "app/workers/*",
    "app/db/session.py",
    "app/repositories/*",
    "app/utils/circuit_breaker.py",
]
branch = true

[tool.bandit]
exclude_dirs = ["tests", "alembic"]
skips = ["B101"]
