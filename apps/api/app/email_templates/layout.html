<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}SoarUp{% endblock %}</title>
</head>
<body style="margin: 0; padding: 0; background-color: #0e0e10; font-family: system-ui, sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #0e0e10; padding: 32px 0;">
    <tr>
      <td align="center">
        <table width="560" cellpadding="0" cellspacing="0"
               style="background-color: #1f1f22; border: 1px solid #48474a; max-width: 560px; width: 100%;">

          <!-- Header -->
          <tr>
            <td style="padding: 24px 32px; border-bottom: 1px solid #48474a;">
              <span style="font-size: 18px; font-weight: 700; color: #53ddfc;
                           letter-spacing: -0.5px;">SoarUp</span>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding: 32px;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding: 16px 32px; border-top: 1px solid #48474a;">
              <p style="margin: 0; font-size: 11px; color: #adaaad;">
                {% block footer %}
                You're receiving this email from SoarUp.
                {% endblock %}
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
