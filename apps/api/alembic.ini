# apps/api/alembic.ini
# Alembic configuration for SoarUp API — async SQLAlchemy + PostgreSQL

[alembic]
# Path to migration scripts (relative to this file)
script_location = alembic

# Prepend current directory to sys.path (for importing app modules)
prepend_sys_path = .

# Migration filename template: YYYYMMDD_HHMM_REV_SLUG
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for migration timestamps (UTC for consistency)
timezone = UTC

# Database URL placeholder — OVERRIDDEN BY env.py using app.config.settings
# This is just a fallback for CLI commands that don't load Python code
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/soarup # pragma: allowlist secret

# Version locations (default is fine)
version_path_separator = os

# Output encoding for migration files
output_encoding = utf-8

# === Post-write Hooks: Auto-format migrations with ruff ===
[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

# === Logging Configuration ===
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
