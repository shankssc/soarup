# docker-compose.yml - Local development environment for SoarUp
# Usage: docker compose up --build

name: soarup

services:
  # === Backend: FastAPI ===
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: soarup-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=local
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - R2_ENDPOINT_URL=${R2_ENDPOINT_URL}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - NOVU_API_KEY=${NOVU_API_KEY:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
    volumes:
      - ./apps/api:/app
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    command: uvicorn app.main:create_app --factory --reload --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Celery Worker ===
  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: soarup-worker
    env_file:
      - .env
    environment:
      - ENVIRONMENT=local
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - R2_ENDPOINT_URL=${R2_ENDPOINT_URL}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./apps/api:/app
    depends_on:
      - api
      - redis
      - minio
    command: celery -A app.workers.celery_app worker --loglevel=info

  # === Celery Beat (scheduled tasks) ===
  beat:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: soarup-beat
    env_file:
      - .env
    environment:
      - ENVIRONMENT=local
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - redis
    command: celery -A app.workers.celery_app beat --loglevel=info

  # === Flower (Celery monitoring) ===
  flower:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: soarup-flower
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL}
    depends_on:
      - redis
    command: celery -A app.workers.celery_app flower --port=5555

  # === Frontend: Next.js ===
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: soarup-web
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api
    command: npm run dev -- --hostname 0.0.0.0

  # === Cache/Queue: Redis ===
  redis:
    image: redis:7-alpine
    container_name: soarup-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # === Object Storage: Minio (S3-compatible for local dev) ===
  minio:
    image: minio/minio
    container_name: soarup-minio
    ports:
      - "9000:9000"
      - "9002:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

# === Named Volumes ===
volumes:
  minio_data:

networks:
  default:
    external: true
    name: supabase_network_soarup
