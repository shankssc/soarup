# docker-compose.test.yml
# Only spins up services not covered by Supabase CLI local stack.
# Prerequisite: `supabase start` must be running (provides Postgres on 54322 + GoTrue on 54321)
# Usage: docker compose -f docker-compose.test.yml up -d
name: soarup-test

services:
  redis:
    image: redis:7-alpine
    container_name: soarup-test-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 3
