# docker-compose.test.yml
# Only spins up services not covered by Supabase CLI local stack.
# Prerequisite: `supabase start` must be running (provides Postgres on 54322 + GoTrue on 54321)
# Usage: docker compose -f docker-compose.test.yml up -d
name: soarup-test

services:
  redis:
    image: redis:7-alpine
    container_name: soarup-test-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 3

  minio:
    image: minio/minio:latest
    container_name: soarup-test-minio
    ports:
      - "9010:9000"       # was 9001 — conflicted with a Windows-reserved
                           # dynamic port range, not an actual process
      - "9011:9090"       # was 9002 — bumped alongside for consistency
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin # pragma: allowlist secret
    command: server /data --console-address ":9090"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 3
