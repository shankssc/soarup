# .github/workflows/deploy-web-staging.yml
name: Deploy Web (Staging)

on:
  push:
    branches: [develop]
    paths: ["apps/web/**"]

concurrency:
  group: deploy-web-staging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (OpenNext)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.STAGING_WEB_SENTRY_DSN }}
          NEXT_PUBLIC_ENVIRONMENT: staging
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.STAGING_WS_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          CI: true
        run: npm run pages:build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy \
            --var NEXT_PUBLIC_SUPABASE_URL:${{ secrets.STAGING_SUPABASE_URL }} \
            --var NEXT_PUBLIC_SUPABASE_ANON_KEY:${{ secrets.STAGING_SUPABASE_ANON_KEY }} \
            --var NEXT_PUBLIC_SENTRY_DSN:${{ secrets.STAGING_WEB_SENTRY_DSN }} \
            --var NEXT_PUBLIC_ENVIRONMENT:staging \
            --var NEXT_PUBLIC_API_BASE_URL:${{ secrets.STAGING_API_BASE_URL }} \
            --var NEXT_PUBLIC_WS_URL:${{ secrets.STAGING_WS_URL }}
