# .github/workflows/pr-checks.yml
# SoarUp CI/CD Pipeline — Monorepo Quality Gates

name: SoarUp CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 2 * * 1" # Weekly security scan: Mondays 2AM UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ===== BACKEND: Quality + Tests (Linux) =====
  api-quality:
    name: Backend Quality (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements*.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local stack
        run: supabase start
        working-directory: ${{ github.workspace }} # running from repo root where supabase/config.toml lives

      - name: Create test database and run migrations
        run: |
          psql postgresql://postgres:postgres@localhost:54322/postgres \
          -c "CREATE DATABASE soarup_test;"
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:54322/soarup_test \
            alembic upgrade head

      - name: Run security scan (Bandit)
        run: bandit -r app -c pyproject.toml -ll

      - name: Run dependency audit (pip-audit)
        run: |
          pip-audit -r requirements.txt -r requirements-dev.txt \
            --ignore-vuln CVE-2026-4539 \
            --ignore-vuln GHSA-6w46-j5rx-g56g \
            --ignore-vuln GHSA-2c2j-9gv5-cj73 \
            --ignore-vuln GHSA-jr27-m4p2-rc6r \
            --ignore-vuln PYSEC-2026-179 \
            --ignore-vuln PYSEC-2026-175 \
            --ignore-vuln PYSEC-2026-177 \
            --ignore-vuln PYSEC-2026-178
        # Suppressed CVEs:
        # GHSA-6w46-j5rx-g56g: pytest 9.x fix conflicts with pytest-asyncio 0.23.x
        #   Revisit when pytest-asyncio ships pytest 9 compatible release
        # GHSA-2c2j-9gv5-cj73: Starlette fix requires 0.47.2, not yet compatible
        #   with fastapi 0.115.x — revisit when FastAPI upgrades Starlette

      - name: Run tests with coverage
        env:
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests/ -v --tb=short \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: success()
        with:
          file: ./coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  # ===== BACKEND: Windows Compatibility Check =====
  api-windows:
    name: Backend (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run basic tests (Windows)
        # Fix 2: Removed continue-on-error — failures now block the merge
        # If Windows compat is genuinely optional, document it explicitly
        # rather than silently swallowing failures
        env:
          PYTHONPATH: ${{ github.workspace }}\apps\api
        run: |
          echo ENVIRONMENT=test > .env
          pytest tests/unit/ -v --tb=short --no-cov -m "not slow and not db"

  # ===== FRONTEND: Quality + Tests =====
  web-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: Run TypeScript check
        run: npm run type-check

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: success()
        with:
          file: ./coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

  # ===== FRONTEND: React Doctor Component Health =====
  react-doctor:
    name: React Doctor
    runs-on: ubuntu-latest
    # PR-only — React Doctor posts findings as PR comments.
    # No value running on push to main/develop since there is no PR to comment on.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    concurrency:
      group: react-doctor-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: millionco/react-doctor@main

  # ===== SECURITY: CodeQL + Dependency Review =====
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [api-quality, web-quality]
    # Fix 3: Added develop to the condition so security scan runs on
    # feature branch → develop merges, not just PRs to main
    if: >
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dependency Review (PRs only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0

      - name: Setup Python for CodeQL
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps for analysis
        run: pip install -r apps/api/requirements.txt

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python, javascript
          queries: +security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis (Python)
        uses: github/codeql-action/analyze@v3
        # Fix 4: Removed malformed category field — let CodeQL default it
        # "/language:python-javascript" is not a valid category value

  # ===== DOCKER: Build Validation =====
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [api-quality, web-quality]
    # Fix 5: Same condition fix as security-scan — include develop
    if: >
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (dry run)
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          file: apps/api/Dockerfile
          load: true
          tags: soarup-api:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (dry run)
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          file: apps/web/Dockerfile
          load: true
          tags: soarup-web:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===== SUMMARY: Report Status =====
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [api-quality, api-windows, web-quality, security-scan, docker-build]
    # Fix 6: !cancelled() ensures summary runs even when upstream jobs
    # are skipped (e.g. security-scan skipped on non-PR/main/develop)
    if: always() && !cancelled()
    steps:
      - name: Report final status
        run: |
          echo "## SoarUp CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend (Linux) | ${{ needs.api-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend (Windows) | ${{ needs.api-windows.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.web-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.api-quality.result }}" = "success" ] && \
             [ "${{ needs.web-quality.result }}" = "success" ]; then
            echo "All critical checks passed. Ready to merge." >> $GITHUB_STEP_SUMMARY
          else
            echo "Some checks failed. Review logs above." >> $GITHUB_STEP_SUMMARY
          fi
