# .github/workflows/pr-checks.yml
# 🚀 SoarUp CI/CD Pipeline — Monorepo Quality Gates

name: 🚀 SoarUp CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 2 * * 1" # Weekly security scan: Mondays 2AM UTC

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Restrict permissions for security best practices
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ===== 🔧 SETUP: Warm caches for all jobs =====
  setup:
    name: 🔧 Setup Dependencies
    runs-on: ubuntu-latest
    outputs:
      api-hash: ${{ steps.api-cache.outputs.cache-hit }}
      web-hash: ${{ steps.web-cache.outputs.cache-hit }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12 (Backend)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements*.txt
        id: api-cache

      - name: 📦 Setup Node.js 20 (Frontend)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
        id: web-cache

      - name: 📦 Install backend dependencies
        run: |
          pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install -r apps/api/requirements-dev.txt
        working-directory: apps/api

      - name: 📦 Install frontend dependencies
        run: npm ci
        working-directory: apps/web

  # ===== 🐍 BACKEND: Quality + Tests (Linux) =====
  api-quality:
    name: 🐍 Backend Quality (Linux)
    runs-on: ubuntu-latest
    needs: [setup]
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements*.txt

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: 🧹 Run linters
        run: |
          ruff check . --output-format=github
          ruff format --check .

      - name: 🔎 Run type checker
        run: mypy app --config-file pyproject.toml --explicit-package-bases --namespace-packages -p app

      - name: 🔐 Run security scan (Bandit)
        run: bandit -r app -c pyproject.toml -ll

      - name: 🔍 Run dependency audit (pip-audit)
        run: pip-audit -r requirements.txt -r requirements-dev.txt --ignore-vuln CVE-2026-4539

      - name: 🧪 Run tests with coverage
        run: |
          # Create minimal .env for tests
          cat > .env << EOF
          ENVIRONMENT=test
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/soarup_test
          REDIS_URL=redis://localhost:6379/0
          EOF
          pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./apps/api/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
        if: success()

  # ===== 🪟 BACKEND: Windows Compatibility Check =====
  api-windows:
    name: 🪟 Backend (Windows)
    runs-on: windows-latest
    needs: [setup]
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: 🧹 Basic linting (Windows)
        run: ruff check . --output-format=github

      - name: 🧪 Run basic tests (Windows)
        run: |
          echo ENVIRONMENT=test > .env
          pytest tests/ -v --tb=short -m "not slow"
        continue-on-error: true # Non-blocking for now

  # ===== 🌐 FRONTEND: Quality + Tests =====
  web-quality:
    name: 🌐 Frontend Quality
    runs-on: ubuntu-latest
    needs: [setup]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧹 Run ESLint
        run: npm run lint

      - name: ✨ Run Prettier check
        run: npm run format:check

      - name: 🔎 Run TypeScript check
        run: npm run type-check

      - name: 🧪 Run unit tests with coverage
        run: npm run test:coverage

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./apps/web/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
        if: success()

  # ===== 🔐 SECURITY: CodeQL + Dependency Review =====
  security-scan:
    name: 🔐 Security Scan
    runs-on: ubuntu-latest
    needs: [setup]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for dependency-review

      - name: 🔍 Dependency Review (PRs only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0

      - name: 🐍 Setup Python for CodeQL
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install backend deps for analysis
        run: pip install -r apps/api/requirements.txt

      - name: 🧪 Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python, javascript
          queries: +security-and-quality

      - name: 🔨 Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: 📊 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python-javascript"

  # ===== 🐳 DOCKER: Build Validation =====
  docker-build:
    name: 🐳 Docker Build Check
    runs-on: ubuntu-latest
    needs: [api-quality, web-quality]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build backend image (dry run)
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          file: apps/api/Dockerfile
          load: true
          tags: soarup-api:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build frontend image (dry run)
        uses: docker/build-push-action@v5
        with:
          context: apps/web
