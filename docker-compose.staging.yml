# docker-compose.staging.yml - Staging environment for SoarUp backend
# Runs on the Hetzner VM. All external services (DB, Redis, R2) are
# real cloud resources, not local containers.
# Usage: docker compose -f docker-compose.staging.yml up -d --build

name: soarup-staging

services:
  # === Backend: FastAPI ===
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: soarup-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Celery Worker ===
  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: soarup-worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - api
    command: celery -A app.workers.celery_app worker --loglevel=info

  # === Celery Beat (scheduled tasks) ===
  beat:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: soarup-beat
    restart: unless-stopped
    env_file:
      - .env
    command: celery -A app.workers.celery_app beat --loglevel=info
